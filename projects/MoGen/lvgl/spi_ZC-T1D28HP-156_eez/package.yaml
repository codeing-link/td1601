## 第一部分： 基础信息
name: spi_ZC-T1D28HP-156_eez
version: V1.0.0
description: SPI LCD ZC-T1D28HP-156 EEZ Studio example
type: solution
yoc_version: V1.0.0
## 第二部分：依赖信息
#           指定该组件依赖的组件及版本，版本支持条件比较，支持：>=v1.0, >v1.0, ==v1.0, <=v1.0, <v1.0, v1.0
#           未指定条件时，默认为 ==，如 v1.0 与 ==v1.0
# depends:                                 # <可选项> 该组件依赖其他的组件，合理的依赖才能保证组件能编译、使用
#   - minilibc: v7.2.0
#   - aos: >=v7.2.0
depends:
  - chip_td1601: V1.0.0
  - console: V1.0.0
  - csi: V1.0.0
  - lvgl: V1.0.0
  - minilibc: V1.0.0
  - mm: V1.0.0
  - td1601_evb: V1.0.0
## 第三部分：板级信息
solution:
  board_name: td1601_evb
  ld_script: ""
## 第四部分：编译连接信息
# build_config:                            # <可选项> 编译配置项
#   include:                               # <可选项> 编译时，影响编译器的-I 参数 ,全局有效
#     - src                                #        include 只能是该软件包下的目录，不能使用外部目录
#   internal_include:                      # <可选项> 编译时，影响编译器的-I 参数 ,组件内有效
#     - include
#   cflag: ''                              # <可选项> C 编译器所需要要的编译参数
#   cxxflag: ''                            # <可选项> CXX 编译器所需要要的编译参数
#   asmflag: ''                            # <可选项> 汇编器所需要要参数
#   define:                                # <可选项> 宏定义, 增加编译器的-D 选项,如：
#     XXX: 1                               #   -DXXX=1
#     AAA: 1                               #   -DAAA
#     STR: "abc"                           #   -DSTR="abc"
#   libs:                                  # 该组件中支持的二进制静态库,如：libxxx.a, libyyy.a
#     - xxx                                #   -lxxx
#     - yyy                                #   -lyyy
#   libpath:                               # 指定静态库所在的路径（相对于该组件路径）
#     - libs                               #   -Llibs
build_config:
  include:
    - include
    - include/sys
    - src
    - src/GC9A01+FT3267
    - src/ui
    - src/lv_port
    - src/eez/1/src/ui
  internal_include: 
  cflag: -Os  -g  -ffunction-sections  -fdata-sections -include include/time.h
  cxxflag: -Os  -g  -fno-exceptions -fno-rtti -ffunction-sections  -fdata-sections -include include/time.h
  asmflag: ""
  define: 
  libs:
    - m
    - stdc++
  libpath: 
  ldflag: -nostartfiles -Wl,--gc-sections -lm  -Wl,-zmax-page-size=1024
# source_file:                             # <可选项> 指定参与编译的源代码文件，支持通配符，采用相对路径
#   - src/*.c                              # 例：组件 src 目录下所有的扩展名为 c 的源代码文件
source_file:
  - ./src/*.c
  - ./src/*.cpp
  - ./src/GC9A01+FT3267/*.c
  - ./src/lv_port/*.c
  - ./src/eez/1/src/ui/*.c
  - ./src/eez/1/src/ui/*.cpp
  - ./*.c
## 第五部分：配置信息
# def_config:                              # 组件的可配置项
#   CONFIG_DEBUG: y
#   CONFIG_PARAM_NOT_CHECK: y
#   CONFIG_CLI: y
def_config:
  CONFIG_KERNEL_NONE: 1
  CONFIG_ARCH_INTERRUPTSTACK: 16384
  CONFIG_DEBUG: 1
  CONFIG_DEBUG_MODE: 0
  CONFIG_XIP: 1
  CONFIG_BENCHMARK: 1
  CONFIG_BENCHMARK_COREMARK: 1
  CONFIG_BENCHMARK_DHRY: 1
  CONFIG_CHIP_TD1601: 1
  CONFIG_SUPPORT_TSPEND: 1
  CONFIG_CPU_E906FD: 1
keywords: 
author: ""
license: ""
depends_forward:
  - chip_td1601: V1.0.0
  - console: V1.0.0
  - csi: V1.0.0
  - lvgl: V1.0.0
  - minilibc: V1.0.0
  - mm: V1.0.0
  - td1601_evb: V1.0.0
defconfig:
  CONFIG_ARCH_INTERRUPTSTACK: 16384
  CONFIG_BENCHMARK: 1
  CONFIG_BENCHMARK_COREMARK: 1
  CONFIG_BENCHMARK_DHRY: 1
  CONFIG_CHIP_TD1601: 1
  CONFIG_CPU_E906FD: 1
  CONFIG_DEBUG: 1
  CONFIG_DEBUG_MODE: 0
  CONFIG_KERNEL_NONE: 1
  CONFIG_SUPPORT_TSPEND: 1
  CONFIG_XIP: 1
link_config:
